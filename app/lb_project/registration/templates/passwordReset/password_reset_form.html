{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<script>
  document.addEventListener("click", function (e) {
    const bubble = document.createElement("div");
    const size = Math.random() * 50 + 30; // Random size between 30 and 80px
    const x = e.clientX;
    const y = e.clientY;

    bubble.style.position = "absolute";
    bubble.style.top = `${y - size / 2}px`;
    bubble.style.left = `${x - size / 2}px`;
    bubble.style.width = `${size}px`;
    bubble.style.height = `${size}px`;
    bubble.style.borderRadius = "50%";
    bubble.style.backgroundColor = `rgba(59, 130, 246, 0.6)`; // Blue color
    bubble.style.animation = "bubble 1s ease-out forwards";

    // Append the bubble to the container
    document.getElementById("bubbles-container").appendChild(bubble);

    // Remove the bubble after the animation ends
    bubble.addEventListener("animationend", () => {
      bubble.remove();
    });
  });
</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Wallpoet&display=swap" rel="stylesheet">
  
  <link rel="stylesheet"
            href="https://fonts.googleapis.com/css?family=Roboto&effect=shadow-multiple|3d-float|anaglyph|fire-animation">
      
            {% tailwind_css %}
      <style>
          body, html{
              color: white;
              margin: 0;
              padding: 0;
              height: 100%;
              background: linear-gradient(45deg, rgb(7, 12, 18) 0%, rgb(23, 40, 61) 50%, rgb(20, 55, 53) 100%);
              font-family: "Poppins";
          }
          input[type = "text"]{
            border-radius: 14px;
            background: none;
          }
          input[type = "password"]{
            border-radius: 14px;
            background: none;
          }
  
  
          @keyframes bubble {
              0% {
                transform: scale(0);
                opacity: 1;
              }
              50% {
                transform: scale(1.5);
                opacity: 0.6;
              }
              100% {
                transform: scale(2);
                opacity: 0;
              }
            }

            #button{
              margin-top : 23px;
            }
            #form{
              padding: 23px;
            }

      </style>
<body id = "bubbles-container">
  <div class="flex flex-col justify-center items-center h-screen space-y-6" style = "padding: 5em; border-radius: 14px;">
    <div>
      <form method="post" class = "bg-white/10 backdrop-blur-9xl rounded-lg" id = "form" action = "#">
        {% csrf_token %}
        <table>
          <tr>
            <td><label for="username">Username:</label></td>
            <td><input type="text" name="username" required class = "text-white text-2xl rounded-lg bg-white/10 backdrop-blur-10xl"></td>
          </tr>
          <tr>
            <td><label for="secret_key">Thapar ID:</label></td>
            <td><input type="text" name="secret_key" required class = "text-white text-2xl rounded-lg bg-white/10 backdrop-blur-10xl"></td>
          </tr>
          <tr>
            <td><label for="new_password">New Password:</label></td>
            <td><input type="password" name="new_password" id = "new_password" required class = "text-white text-2xl rounded-lg bg-white/10 backdrop-blur-10xl"></td>
          </tr>
          <tr>
            <td><label for="conf_password">Confirm New Password:</label></td>
            <td><input type="password" name="conf_password" id = "conf_password" required class = "text-white text-2xl rounded-lg bg-white/10 backdrop-blur-10xl"></td>
          </tr>
        </table>
        <center>

            <button type="submit" class = "bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded text-2xl">
              Reset Password
            </button>

        </center>
      </form>
      
    </div>
  </div>
</body>
</html>
