<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard</title>
    <style>
        @keyframes bubble {
          0% {
            transform: scale(0);
            opacity: 1;
          }
          50% {
            transform: scale(1.5);
            opacity: 0.6;
          }
          100% {
            transform: scale(2);
            opacity: 0;
          }
        }
      </style>
      
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        function fetchLeaderboard() {
            fetch("leaderboard/list/")
            .then(response => response.json())
            .then(data => {
                let tableBody = document.getElementById("mleaderboard");
                tableBody.innerHTML = ""; // Clear existing table

                data.forEach((entry, index) => {
                    let rankClass = "";
                    if (index === 0) rankClass = "bg-yellow-400 text-black";   // 🥇 Gold
                    else if (index === 1) rankClass = "bg-gray-400 text-black"; // 🥈 Silver
                    else if (index === 2) rankClass = "bg-orange-400 text-black"; // 🥉 Bronze
                    else rankClass = "bg-gray-800"; // Default

                    let row = `
                        <tr class="text-lg border-b border-gray-700">
                            <td class="py-2 px-4 text-center font-bold ${rankClass} rounded-lg">${index + 1}</td>
                            <td class="py-2 px-4">${entry.team_name}</td>
                            <td class="py-2 px-4 text-center">${entry.score}</td>
                        </tr>`;
                    tableBody.innerHTML += row;
                });
            })
            .catch(error => console.error("Error fetching leaderboard:", error));
        }

        setInterval(fetchLeaderboard, 5000); // Refresh every 5 seconds
        window.onload = fetchLeaderboard;


        document.addEventListener("click", function (e) {
            const bubble = document.createElement("div");
            const size = Math.random() * 50 + 30; // Random size between 30 and 80px
            const x = e.clientX;
            const y = e.clientY;
        
            bubble.style.position = "absolute";
            bubble.style.top = `${y - size / 2}px`;
            bubble.style.left = `${x - size / 2}px`;
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            bubble.style.borderRadius = "50%";
            bubble.style.backgroundColor = `rgba(59, 130, 246, 0.6)`; // Blue color
            bubble.style.animation = "bubble 1s ease-out forwards";
        
            // Append the bubble to the container
            document.getElementById("bubbles-container").appendChild(bubble);
        
            // Remove the bubble after the animation ends
            bubble.addEventListener("animationend", () => {
              bubble.remove();
            });
          });
    </script>
</head>
<body class="bg-gradient-to-br from-gray-900 to-black min-h-screen flex items-center justify-center" id = "bubbles-container">
    <div class="w-full max-w-3xl p-6 bg-white/10 backdrop-blur-md rounded-2xl shadow-xl border border-gray-700">
        <h2 class="text-3xl font-bold text-white text-center mb-4">🏆 Leaderboard 🏆</h2>
        <div class="overflow-hidden rounded-lg">
            <table class="w-full text-white text-left border-collapse">
                <thead>
                    <tr class="bg-gray-800 text-lg">
                        <th class="py-2 px-4">Rank</th>
                        <th class="py-2 px-4">Player Name</th>
                        <th class="py-2 px-4 text-center">Score</th>
                    </tr>
                </thead>
                <tbody id="mleaderboard">
                    <!-- Dynamic leaderboard data will be inserted here -->
                </tbody>
            </table>
            <button onclick="clearLeaderboard()" class="mt-4 bg-red-500 text-white px-4 py-2 rounded-lg">
                Clear Leaderboard
            </button>
            
            <script>
                function clearLeaderboard() {
                    fetch("/leaderboard/clear/", { method: "DELETE" })
                    .then(response => response.json())
                    .then(data => {
                        console.log("Leaderboard cleared:", data);
                        document.getElementById("mleaderboard").innerHTML = ""; // Clear frontend display
                    })
                    .catch(error => console.error("Error clearing leaderboard:", error));
                }
            </script>
        </div>
    </div>
    
    
</body>
</html>
